spring:
  config:
    activate:
      on-profile: prod

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

# All service URLs injected via environment variables in production
# Set these in your Kubernetes ConfigMap / Docker Compose env block

# Stricter logging in production — only WARN and above for framework internals
logging:
  level:
    com.mobisec.in.apigateway: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
    reactor.netty: WARN

# Only show health details to authorized principals in production
management:
  endpoint:
    health:
      show-details: when_authorized
  server:
    # Optionally expose actuator on a separate internal port
    port: ${MANAGEMENT_PORT:8090}
