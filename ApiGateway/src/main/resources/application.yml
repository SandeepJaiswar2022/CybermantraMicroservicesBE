server:
  port: 8080

spring:
  application:
    name: api-gateway

  profiles:
    active: dev

  # ── Redis (rate limiting) ──────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  # ── Security / OAuth2 Resource Server ─────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # RSA public key loaded from classpath (same key Auth Service uses to sign)
          public-key-location: classpath:public.pem

  # ── Spring Cloud Gateway Routes ───────────────────────────────────────────
  cloud:
    gateway:
      # Global default filters applied to every route
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=X-Gateway, api-gateway

      routes:

        # ── Auth Service ─────────────────────────────────────────────────────
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 2
                key-resolver: "#{@userOrIpKeyResolver}"

        # ── User Profile Service ─────────────────────────────────────────────
        - id: user-profile-service
          uri: ${USER_PROFILE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # ── Course Service ───────────────────────────────────────────────────
        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/courses/**, /api/v1/categories/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"
            - name: CircuitBreaker
              args:
                name: courseServiceCircuitBreaker
                fallbackUri: forward:/fallback/courses

        # ── Content Service ──────────────────────────────────────────────────
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/content/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"
            - name: CircuitBreaker
              args:
                name: contentServiceCircuitBreaker
                fallbackUri: forward:/fallback/content

      # Global CORS settings (also configured in SecurityConfig for WebFlux)
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# ── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, gateway
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ── Resilience4j ────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      courseServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 60
        eventConsumerBufferSize: 10
      contentServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 20s
        failureRateThreshold: 40
        eventConsumerBufferSize: 10
  timelimiter:
    instances:
      courseServiceCircuitBreaker:
        timeoutDuration: 5s
      contentServiceCircuitBreaker:
        timeoutDuration: 10s

# ── Logging ────────────────────────────────────────────────────────────────
logging:
  config: classpath:logback-spring.xml
  level:
    com.mobisec.in.apigateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: WARN
    io.github.resilience4j: INFO


jwt:
  public-key-path: classpath:keys/public_key.pem
