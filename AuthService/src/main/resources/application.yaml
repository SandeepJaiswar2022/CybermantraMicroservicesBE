spring:
  application:
    name: AuthService

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cm_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Post@123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
        ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      hibernate.physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      hibernate.implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: sandy2662001@gmail.com
    password: odhyeiiygyddzyxe
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

jwt:
  private-key-path: classpath:keys/private_key.pem
  issuer: auth-service
  access-token-expiry-seconds: 900
  service-token-expiry-seconds: 1800
  refresh-idle-expiry-seconds: 604800
  refresh-max-expiry-seconds: 2592000

server:
  port: 8081

api:
  base-url: /api/v1

app:
  verification-url: ${VERIFICATION_URL:http://localhost:8080/api/v1/auth/verify-email}

# ── Service registry — secrets for internal service-to-service auth ─────────
# In production replace values with environment variable references
# These must match the secrets configured in each downstream service's yml
service-registry:
  secrets:
    course-service: ${COURSE_SERVICE_SECRET:course-service-local-secret-change-in-prod}
    user-profile-service: ${USER_PROFILE_SERVICE_SECRET:user-profile-local-secret-change-in-prod}


# ── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.learning.authservice: DEBUG
    org.springframework.amqp: DEBUG