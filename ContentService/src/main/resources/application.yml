server:
  port: 8084

spring:
  application:
    name: content-service

  security:
    user:
      name: disabled
      password: disabled

  # ?? PostgreSQL ??
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cm_content_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Post@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ContentServicePool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          batch_size: 25
        order_inserts: true

  # ?? Flyway ????
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # ?? RabbitMQ ???
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # Publisher confirms ensure broker acknowledged the message
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
        acknowledge-mode: manual

  # ?? Redis (SSE broadcast across pods) ?????
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ?? Jackson ?????????????????????????????????????????????????????????????????
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ?? MinIO ????????????????????????????????????????????????????????????????????
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:lms-content}
  presigned-expiry:
    # Minutes ? generous to support slow connections and large files
    video: 720          # 12 hours for large video files
    resource: 120       # 2 hours for documents
    thumbnail: 30       # 30 minutes for images
  multipart:
    # Files >= this size use multipart upload
    threshold-bytes: 104857600    # 100 MB
    # Each part size ? MinIO minimum is 5MB, we use 10MB
    part-size-bytes: 10485760     # 10 MB per part

# ?? JWT ??????????????????????????????????????????????????????????????????????
jwt:
  # Place your public_key.pem file under src/main/resources/keys/
  # This must be the same RSA public key used by your auth-service
  public-key-path: classpath:keys/public_key.pem

# ?? Outbox Scheduler ?????????????????????????????????????????????????????????
outbox:
  scheduler:
    fixed-delay-ms: 500       # Poll DB every 500ms for unpublished events
    batch-size: 50            # Max events to process per run
  cleanup:
    retention-days: 7         # Delete published events older than 7 days
    cron: "0 0 2 * * *"       # Run cleanup at 2 AM daily

# ?? Content Rules ????????????????????????????????????????????????????????????
content:
  upload:
    max-size-bytes:
      video: 5368709120       # 5 GB
      resource: 524288000     # 500 MB
      thumbnail: 10485760     # 10 MB
  cleanup:
    # UPLOADING records older than this are considered abandoned
    abandoned-threshold-hours: 6
    cron: "0 0 */2 * * *"     # Run every 2 hours

# ?? Actuator ?????????????????????????????????????????????????????????????????
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ?? Logging ??????????????????????????????????????????????????????????????????
logging:
  level:
    com.mobisec.in.contentservice: INFO
    org.springframework.security: WARN
    io.minio: WARN
    org.springframework.amqp: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
